serve:
  cookies:
    same_site_mode: Lax
  public:
    cors:
      enabled: true
      allowed_origins:
        - http://localhost:5173
    # TLS termination is handled by the ingress controller or load balancer, or not used in local dev
    # tls:
    #   key: 
    #   cert: 
  admin:
    cors:
      enabled: true
      allowed_origins:
        - http://localhost:5173

urls:
  self:
    issuer: http://localhost:4444
  login: http://localhost:5173/login
  consent: http://localhost:5173/consent
  logout: http://localhost:5173/logout

secrets:
  system:
    - youReallyNeedToChangeThis

dsn: postgres://hydra:secret@db:5432/hydra?sslmode=disable

strategies:
  access_token: jwt

oauth2:
  expose_internal_errors: true
  mirror_top_level_claims: true

oidc:
  subject_identifiers:
    supported_types:
      - public
